name: Build and test AiChatBuddy MCP
on:
  push:
    branches: [master, feature/mcp-client]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build and test
        run: bash gradlew --no-daemon clean build exportDevDependencies
      - name: Package source
        if: always()
        run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aichatbuddy-build
          path: |
            build/libs/*.jar
            build/test-results/
            build/reports/tests/
            source.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: dev-dependencies
          path: build/dev-dependencies/
          retention-days: 2
